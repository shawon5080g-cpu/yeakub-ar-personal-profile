<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RX YEAKUB HACKER – UploadToLink</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: radial-gradient(circle at 10% 20%, #0a0a1a, #1a0a2e, #0f0c29);
            background-attachment: fixed;
        }
        .card {
            max-width: 720px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 32px 28px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header .brand .logo {
            font-size: 24px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .header .brand .logo-sub { color: #b0b3d0; font-size: 13px; }
        .header .badge {
            background: rgba(240,147,251,0.15);
            padding: 6px 16px;
            border-radius: 40px;
            color: #f093fb;
            font-size: 13px;
            border: 1px solid rgba(240,147,251,0.2);
        }
        .user-banner {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .user-banner .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 18px;
        }
        .user-banner .info .name { color: #fff; font-weight: 700; font-size: 16px; }
        .user-banner .info .name span { color: #f093fb; }
        .user-banner .info .tag { color: #6a6d94; font-size: 12px; }
        .user-banner .info .tag i { color: #4caf50; margin-right: 4px; }
        .tabs {
            display: flex;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tabs button {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: #6a6d94;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tabs button.active { background: rgba(255,255,255,0.1); color: #fff; }
        .tabs button:hover { color: #fff; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .tab-content label { color: #b0b3d0; font-size: 13px; font-weight: 500; display: block; margin-bottom: 6px; }
        .tab-content input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .tab-content input:focus { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); }
        .tab-content input::placeholder { color: #4a4d73; }
        .file-upload-area {
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            color: #6a6d94;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 12px;
        }
        .file-upload-area:hover { border-color: rgba(240,147,251,0.4); background: rgba(255,255,255,0.02); }
        .file-upload-area .icon { font-size: 36px; margin-bottom: 6px; color: #f093fb; }
        .file-upload-area .small { font-size: 12px; color: #4a4d73; }
        .file-upload-area .file-name { color: #fff; font-weight: 500; margin-top: 4px; }
        .action-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .action-row button {
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-row button:hover { transform: scale(1.03); box-shadow: 0 8px 28px rgba(245,87,108,0.3); }
        .action-row button.secondary { background: rgba(255,255,255,0.07); }
        .action-row button.secondary:hover { background: rgba(255,255,255,0.14); }
        .output-area {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            display: none;
        }
        .output-area.show { display: block; }
        .output-area .link-box {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .output-area .link-box input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 14px;
            min-width: 150px;
            font-family: monospace;
            word-break: break-all;
        }
        .output-area .link-box button {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            background: #4caf50;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .output-area .link-box button:hover { background: #45a049; }
        .output-area .link-box button.secondary { background: rgba(255,255,255,0.08); }
        .output-area .preview {
            margin-top: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            color: #b0b3d0;
            font-size: 13px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .file-list {
            margin-top: 16px;
            max-height: 300px;
            overflow-y: auto;
        }
        .file-list .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .file-list .file-item .info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        .file-list .file-item .info .icon { font-size: 20px; color: #f093fb; }
        .file-list .file-item .info .name { color: #fff; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-list .file-item .info .size { color: #6a6d94; font-size: 12px; }
        .file-list .file-item .actions { display: flex; gap: 6px; flex-shrink: 0; }
        .file-list .file-item .actions button {
            padding: 4px 10px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.06);
            color: #b0b3d0;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }
        .file-list .file-item .actions button:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .file-list .file-item .actions button.del { color: #f44336; }
        .file-list .file-item .actions button.del:hover { background: rgba(244,67,54,0.2); }
        .empty-state { text-align: center; color: #4a4d73; padding: 20px 0; font-size: 14px; }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #3a3d5a;
            font-size: 12px;
        }
        .footer .signature { color: #f093fb; font-weight: 600; }
        .footer a { color: #7a7da8; text-decoration: none; }
        .footer a:hover { color: #b0b3d0; }
        @media (max-width: 480px) {
            .card { padding: 16px; }
            .header .brand .logo { font-size: 18px; }
            .tabs button { font-size: 12px; padding: 8px 0; }
            .user-banner { flex-wrap: wrap; }
            .file-list .file-item { flex-wrap: wrap; gap: 8px; }
            .file-list .file-item .info { width: 100%; }
        }
    </style>
</head>
<body>

<div class="card">

    <div class="header">
        <div class="brand">
            <span class="logo">⬆ UploadToLink</span>
            <span class="logo-sub">by</span>
        </div>
        <span class="badge"><i class="fas fa-link"></i> View & Share</span>
    </div>

    <div class="user-banner">
        <div class="avatar">RX</div>
        <div class="info">
            <div class="name"><i class="fas fa-user-astronaut" style="color:#f093fb; margin-right:6px;"></i> RX <span>YEAKUB HACKER</span></div>
            <div class="tag"><i class="fas fa-check-circle"></i> Verified · <span id="storageCount">0</span> files shared</div>
        </div>
        <div style="font-size:12px; color:#6a6d94;">
            <i class="fas fa-database"></i> <span id="storageCount2">0</span>
        </div>
    </div>

    <div class="tabs">
        <button class="active" data-tab="upload"><i class="fas fa-cloud-upload-alt"></i> Upload</button>
        <button data-tab="myfiles"><i class="fas fa-folder"></i> My Files</button>
    </div>

    <div id="tab-upload" class="tab-content active">
        <label>📛 Your custom link name (this will be in the URL)</label>
        <input type="text" id="linkName" placeholder="e.g. my_page" style="margin-bottom:12px;" />

        <label>📎 Choose a file</label>
        <div class="file-upload-area" id="fileDropArea">
            <div class="icon"><i class="fas fa-cloud-upload-alt"></i></div>
            <div>Click or drag & drop a file here</div>
            <div class="small">Max 5 MB · Any file type</div>
            <div class="file-name" id="selectedFileName"></div>
            <input type="file" id="fileInput" style="display:none;" />
        </div>

        <div class="action-row">
            <button id="uploadBtn"><i class="fas fa-upload"></i> Upload & Generate Link</button>
            <button class="secondary" id="clearBtn"><i class="fas fa-eraser"></i> Clear</button>
        </div>

        <div class="output-area" id="outputArea">
            <div class="link-box">
                <input type="text" id="shareLink" readonly placeholder="Your link will appear here" />
                <button id="copyLinkBtn"><i class="fas fa-copy"></i> Copy</button>
                <button id="openLinkBtn" class="secondary"><i class="fas fa-external-link-alt"></i> Open</button>
            </div>
            <div class="preview" id="previewBox">
                <div class="file-meta">📄 Waiting for file...</div>
            </div>
        </div>
    </div>

    <div id="tab-myfiles" class="tab-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <label style="margin:0;">📂 All uploaded files</label>
            <button class="secondary" id="refreshFiles" style="padding:4px 16px; border-radius:20px; border:none; background:rgba(255,255,255,0.06); color:#b0b3d0; cursor:pointer;">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
        <div class="file-list" id="fileList">
            <div class="empty-state">📭 No files uploaded yet.</div>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 — <span class="signature">RX YEAKUB HACKER</span> &bull;
        Made with <span style="color:#f5576c;">❤</span> &bull;
        <a href="#">Privacy</a> · <a href="#">Terms</a>
        <br />
        <span style="font-size:10px; color:#2a2d4a;">⚡ Files stored locally · Share via view link</span>
    </div>

</div>

<script>
    (function() {
        const CREATOR = "RX YEAKUB HACKER";
        console.log(`🚀 UploadToLink by ${CREATOR}`);

        // ===== CHECK FOR VIEW PARAMETER =====
        const urlParams = new URLSearchParams(window.location.search);
        const viewFile = urlParams.get('view');
        if (viewFile) {
            const files = JSON.parse(localStorage.getItem('uploadtolink_data_files') || '[]');
            const found = files.find(f => f.linkName === viewFile);
            if (found && found.dataUrl) {
                if (found.type && found.type.includes('html')) {
                    document.write(atob(found.dataUrl.split(',')[1]));
                    document.close();
                } else {
                    window.location.href = found.dataUrl;
                }
                return;
            } else {
                document.write('<h1 style="color:#fff;text-align:center;margin-top:50px;">❌ File not found</h1>');
                document.close();
                return;
            }
        }

        // ===== TABS =====
        const tabs = document.querySelectorAll('.tabs button');
        const contents = {
            upload: document.getElementById('tab-upload'),
            myfiles: document.getElementById('tab-myfiles')
        };
        tabs.forEach(btn => {
            btn.addEventListener('click', function() {
                tabs.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                Object.keys(contents).forEach(key => {
                    contents[key].classList.remove('active');
                });
                contents[this.dataset.tab].classList.add('active');
                if (this.dataset.tab === 'myfiles') renderFileList();
            });
        });

        // ===== FILE UPLOAD =====
        const fileInput = document.getElementById('fileInput');
        const fileDropArea = document.getElementById('fileDropArea');
        const selectedFileName = document.getElementById('selectedFileName');
        const linkNameInput = document.getElementById('linkName');
        let selectedFile = null;

        fileDropArea.addEventListener('click', () => fileInput.click());
        fileDropArea.addEventListener('dragover', (e) => { e.preventDefault(); fileDropArea.style.borderColor = '#f093fb'; });
        fileDropArea.addEventListener('dragleave', () => { fileDropArea.style.borderColor = 'rgba(255,255,255,0.1)'; });
        fileDropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            fileDropArea.style.borderColor = 'rgba(255,255,255,0.1)';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', function() {
            if (this.files.length) handleFile(this.files[0]);
        });

        function handleFile(file) {
            if (file.size > 5 * 1024 * 1024) { alert('File too large! Max 5 MB.'); return; }
            selectedFile = file;
            selectedFileName.textContent = `📎 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
            selectedFileName.style.color = '#4caf50';
            if (!linkNameInput.value.trim()) {
                linkNameInput.value = file.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9_\-]/g, '_');
            }
        }

        document.getElementById('clearBtn').addEventListener('click', function() {
            selectedFile = null;
            fileInput.value = '';
            selectedFileName.textContent = '';
            linkNameInput.value = '';
            document.getElementById('outputArea').classList.remove('show');
        });

        // ===== UPLOAD & GENERATE LINK =====
        document.getElementById('uploadBtn').addEventListener('click', function() {
            if (!selectedFile) { alert('Please select a file first!'); return; }
            let linkName = linkNameInput.value.trim();
            if (!linkName) { alert('Please enter a name for the link!'); return; }
            linkName = linkName.replace(/[^a-zA-Z0-9_\-]/g, '_').toLowerCase();
            if (linkName.length < 3) { alert('Name must be at least 3 characters.'); return; }

            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('uploadBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;

                const fileData = {
                    linkName: linkName,
                    displayName: linkNameInput.value.trim(),
                    originalName: selectedFile.name,
                    size: selectedFile.size,
                    type: selectedFile.type || 'application/octet-stream',
                    dataUrl: dataUrl,
                    uploadedAt: new Date().toISOString(),
                    creator: CREATOR
                };

                let files = JSON.parse(localStorage.getItem('uploadtolink_data_files') || '[]');
                files = files.filter(f => f.linkName !== linkName);
                files.unshift(fileData);
                localStorage.setItem('uploadtolink_data_files', JSON.stringify(files));

                updateStorageCount();

                // 🔥 This creates the link with YOUR custom name
                const baseUrl = window.location.origin + window.location.pathname;
                const shareUrl = baseUrl + '?view=' + encodeURIComponent(linkName);

                document.getElementById('shareLink').value = shareUrl;
                document.getElementById('previewBox').innerHTML = `
                    <div class="file-meta">
                        📄 <strong>${fileData.displayName}</strong><br />
                        📎 Original: ${selectedFile.name}<br />
                        📦 Size: ${(selectedFile.size/1024).toFixed(1)} KB<br />
                        🕒 Uploaded: ${new Date().toLocaleString()}<br />
                        👤 Creator: <span style="color:#f093fb;">${CREATOR}</span>
                        <br /><br />
                        🔗 Your link: <span style="color:#4caf50;word-break:break-all;">${shareUrl}</span>
                    </div>
                `;
                document.getElementById('outputArea').classList.add('show');

                selectedFile = null;
                fileInput.value = '';
                selectedFileName.textContent = '';
                linkNameInput.value = '';
                renderFileList();
                document.getElementById('uploadBtn').disabled = false;
                document.getElementById('uploadBtn').innerHTML = '<i class="fas fa-upload"></i> Upload & Generate Link';
                alert('✅ File uploaded! Copy the link and share it.');
            };

            reader.readAsDataURL(selectedFile);
        });

        // ===== COPY LINK =====
        document.getElementById('copyLinkBtn').addEventListener('click', function() {
            const input = document.getElementById('shareLink');
            input.select();
            input.setSelectionRange(0, 999999);
            try {
                document.execCommand('copy');
                alert('✅ Link copied to clipboard!');
            } catch (err) {
                alert('❌ Copy failed. Please select and copy manually.');
            }
        });

        // ===== OPEN LINK =====
        document.getElementById('openLinkBtn').addEventListener('click', function() {
            const link = document.getElementById('shareLink').value;
            if (link) {
                window.open(link, '_blank');
            } else {
                alert('❌ No link to open.');
            }
        });

        // ===== FILE LIST =====
        function renderFileList() {
            const container = document.getElementById('fileList');
            const files = JSON.parse(localStorage.getItem('uploadtolink_data_files') || '[]');

            if (files.length === 0) {
                container.innerHTML = `<div class="empty-state">📭 No files uploaded yet.</div>`;
                return;
            }

            let html = '';
            files.forEach((file) => {
                const icon = file.type.startsWith('image/') ? 'fa-image' :
                            file.type.startsWith('text/') ? 'fa-file-alt' :
                            file.type.includes('pdf') ? 'fa-file-pdf' :
                            file.type.includes('zip') || file.type.includes('rar') ? 'fa-file-archive' : 'fa-file';
                const sizeKB = (file.size / 1024).toFixed(1);
                const baseUrl = window.location.origin + window.location.pathname;
                const viewUrl = baseUrl + '?view=' + encodeURIComponent(file.linkName);
                html += `
                    <div class="file-item">
                        <div class="info">
                            <span class="icon"><i class="fas ${icon}"></i></span>
                            <div>
                                <div class="name">${file.displayName || file.linkName}</div>
                                <div class="size">${sizeKB} KB · ${new Date(file.uploadedAt).toLocaleDateString()}</div>
                            </div>
                        </div>
                        <div class="actions">
                            <button onclick="window.open('${viewUrl}','_blank')"><i class="fas fa-eye"></i></button>
                            <button onclick="navigator.clipboard.writeText('${viewUrl}').then(()=>alert('Link copied!')).catch(()=>alert('Copy manually: ${viewUrl}'))"><i class="fas fa-copy"></i></button>
                            <button class="del" onclick="deleteFile('${file.linkName}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.deleteFile = function(linkName) {
            if (!confirm(`Delete "${linkName}" from list?`)) return;
            let files = JSON.parse(localStorage.getItem('uploadtolink_data_files') || '[]');
            files = files.filter(f => f.linkName !== linkName);
            localStorage.setItem('uploadtolink_data_files', JSON.stringify(files));
            renderFileList();
            updateStorageCount();
            alert('🗑️ Removed from list.');
        };

        document.getElementById('refreshFiles').addEventListener('click', renderFileList);

        function updateStorageCount() {
            const files = JSON.parse(localStorage.getItem('uploadtolink_data_files') || '[]');
            document.getElementById('storageCount').textContent = files.length;
            document.getElementById('storageCount2').textContent = files.length;
        }

        updateStorageCount();
        if (document.querySelector('[data-tab="myfiles"].active')) renderFileList();

        console.log(`✅ UploadToLink by ${CREATOR} loaded.`);
        console.log(`📤 ${JSON.parse(localStorage.getItem('uploadtolink_data_files') || '[]').length} files stored.`);

    })();
</script>
</body>
</html>
